name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsoapysdr-dev libclang-dev pkg-config \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
      - name: Diagnose with runtime packages
        run: |
          sudo apt-get install -y --no-install-recommends soapysdr-module-rtlsdr soapysdr-module-hackrf libiio0 ffmpeg
          ./target/release/qoda --diagnose
      - name: Upload binaries
        uses: actions/upload-artifact@v5
        with:
          name: qoda-linux-x86_64
          path: |
            target/release/qoda
            target/release/qoda-analyze

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: brew install pkg-config soapysdr soapyrtlsdr soapyhackrf libiio ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
      - name: Diagnose
        run: ./target/release/qoda --diagnose
      - name: Upload binaries
        uses: actions/upload-artifact@v5
        with:
          name: qoda-macos-arm64
          path: |
            target/release/qoda
            target/release/qoda-analyze
