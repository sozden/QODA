name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsoapysdr-dev libclang-dev pkg-config dpkg-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
      - name: Diagnose with runtime packages
        run: |
          sudo apt-get install -y --no-install-recommends soapysdr-module-rtlsdr soapysdr-module-hackrf libiio0 ffmpeg
          ./target/release/qoda --diagnose
      - name: Upload binaries
        uses: actions/upload-artifact@v5
        with:
          name: qoda-linux-x86_64
          path: |
            target/release/qoda
            target/release/qoda-analyze
      - name: Linux packages
        run: bash tools/linux/package.sh
      - name: Upload packages
        uses: actions/upload-artifact@v5
        with:
          name: qoda-linux-packages
          path: |
            dist/*.deb
            dist/*.tar.gz
      - name: Attach packages to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release is created by hand with the Windows zips; wait for it if needed.
          for i in $(seq 1 30); do gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break; sleep 60; done
          gh release upload "$GITHUB_REF_NAME" dist/*.deb dist/*.tar.gz --clobber

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: brew install pkg-config soapysdr soapyrtlsdr soapyhackrf ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
      - name: Diagnose
        run: ./target/release/qoda --diagnose
      - name: Upload binaries
        uses: actions/upload-artifact@v5
        with:
          name: qoda-macos-arm64
          path: |
            target/release/qoda
            target/release/qoda-analyze
